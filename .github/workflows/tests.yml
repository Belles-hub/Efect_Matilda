name: Testes

# Roda a suíte a cada push/PR pra main ou master — pega quebra antes de
# chegar em produção, em vez de descobrir depois do deploy.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Rodar a suíte de testes
        env:
          # Com os secrets configurados (Settings > Secrets and variables >
          # Actions), a suíte inteira roda contra o Firestore. Sem eles, roda
          # só a suíte "offline" (testes que não usam o banco) e pula o
          # resto, em vez de falhar. Use um projeto Firebase de TESTES nos
          # secrets: os testes criam e apagam usuários de verdade.
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          # Sem secret, um valor fixo só pros testes offline (o app se recusa
          # a iniciar sem uma chave de assinatura de tokens).
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'chave-so-para-testes-no-ci' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: pytest tests/ -v
